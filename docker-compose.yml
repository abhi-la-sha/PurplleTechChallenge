services:
  postgres:
    image: postgres:16-alpine
    container_name: store-intel-postgres
    environment:
      POSTGRES_USER: store_intel
      POSTGRES_PASSWORD: store_intel
      POSTGRES_DB: store_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store_intel -d store_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: store-intel-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: docker
      DATABASE_URL: postgresql+asyncpg://store_intel:store_intel@postgres:5432/store_intelligence
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
